<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>음원 추출</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon-192.png" />
<meta name="theme-color" content="#0f1115" />
<style>
  :root {
    --bg: #0f1115; --surface: #181b21; --border: #272b33;
    --text: #e6e8ec; --text-dim: #9aa0ab; --accent: #4f8ef7; --danger: #e5534b; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input, button { font: inherit; border-radius: 8px; border: 1px solid var(--border); }
  input {
    flex: 1; min-width: 0; padding: 12px 14px; background: var(--surface); color: var(--text);
    /* 모바일에서 포커스 시 확대되지 않도록 16px 유지 */ font-size: 16px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 12px 18px; background: var(--accent); color: #fff; border-color: transparent;
    font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .job {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 10px;
  }
  .job-title { font-weight: 600; word-break: break-all; }
  .title-row { display: flex; gap: 8px; align-items: flex-start; }
  .title-row .job-title { flex: 1; min-width: 0; }
  .ghost {
    padding: 4px 10px; background: transparent; color: var(--text-dim);
    border-color: var(--border); font-size: 13px; font-weight: 500; flex-shrink: 0;
  }
  .edit-row { display: flex; gap: 6px; }
  .edit-row input { padding: 8px 10px; }
  .edit-row button { padding: 8px 12px; }
  .job-meta { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .err { color: var(--danger); font-size: 13px; margin-top: 6px; word-break: break-all; }
  .offline {
    margin: 0 0 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
    background: #2a1a19; border: 1px solid var(--danger); color: var(--danger);
  }
  .saved {
    margin-top: 10px; color: var(--ok); font-size: 13px; word-break: break-all;
    user-select: all; /* 경로를 길게 눌러 한 번에 복사 */
  }
  .empty { color: var(--text-dim); text-align: center; padding: 32px 0; }
  .results-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; color: var(--text-dim); font-size: 13px;
  }
  .result {
    display: flex; gap: 10px; align-items: center; padding: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
  }
  .result img {
    width: 110px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px;
    background: var(--border); flex-shrink: 0;
  }
  .result-body { flex: 1; min-width: 0; }
  .result-title {
    font-weight: 600; font-size: 14px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .result-meta { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
  .result button { padding: 8px 14px; font-size: 14px; flex-shrink: 0; }
</style>
</head>
<body>
<main>
  <h1>음원 추출</h1>

  <form id="f">
    <input id="q" type="text" placeholder="검색어 또는 영상 링크" required autocomplete="off" />
    <button type="submit">검색</button>
  </form>

  <p id="offline" class="offline" role="status" hidden>
    서버에 연결할 수 없습니다 — Termux(서버)가 떠 있는지 확인하세요. 계속 다시 시도합니다.
  </p>

  <section id="results" aria-live="polite"></section>
  <div id="list" aria-live="polite"></div>
</main>

<script>
  const LABEL = { queued: "대기 중", downloading: "다운로드 중", converting: "음원 추출 중", done: "완료", error: "실패" };

  const f = document.getElementById("f");
  const qInput = document.getElementById("q");
  const list = document.getElementById("list");
  const results = document.getElementById("results");
  const offline = document.getElementById("offline");

  //수정 중인 작업 id + 입력값·커서 — 폴링 재렌더 때 그대로 복원해서 입력이 날아가지 않게 한다
  //(재렌더를 건너뛰면 수정 중에 다른 작업 진행률까지 멈춘다)
  let editingId = null;
  let editingTitle = null;
  let editingCaret = null;

  function stopEditing() {
    editingId = null;
    editingTitle = null;
    editingCaret = null;
  }

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const value = qInput.value.trim();
    if (!value) return;

    const btn = f.querySelector("button");
    btn.disabled = true;
    try {
      //링크면 바로 추출, 아니면 검색 — 입력창 하나로 둘 다 받는다
      if (/^https?:\/\//i.test(value)) {
        await createJob(value);
        qInput.value = "";
      } else {
        await runSearch(value);
      }
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
    }
  });

  async function createJob(url) {
    const res = await fetch("/api/jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    if (!res.ok) throw new Error((await res.json()).detail ?? "요청 실패");
    await refresh();
  }

  async function runSearch(query) {
    results.innerHTML = '<p class="empty">검색 중…</p>';
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    if (!res.ok) {
      results.innerHTML = "";
      throw new Error((await res.json()).detail ?? "검색 실패");
    }
    renderResults(await res.json());
  }

  function fmtDuration(sec) {
    if (!sec) return "";
    const m = Math.floor(sec / 60);
    return `${m}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;
  }

  function renderResults(items) {
    if (!items.length) {
      results.innerHTML = '<p class="empty">검색 결과가 없습니다.</p>';
      return;
    }
    results.innerHTML =
      `<div class="results-head"><span>검색 결과 ${items.length}건</span>
         <button class="ghost" data-action="clear-results">닫기</button></div>` +
      items
        .map((it) => {
          const meta = [it.channel, fmtDuration(it.duration)].filter(Boolean).join(" · ");
          //src·data-url 은 속성이라 따옴표까지 escape 하는 escAttr 를 쓴다
          const thumb = it.thumbnail
            ? `<img src="${escAttr(it.thumbnail)}" alt="" loading="lazy" width="110" height="62" />`
            : `<img alt="" width="110" height="62" />`;
          return `<div class="result">
            ${thumb}
            <div class="result-body">
              <div class="result-title">${esc(it.title)}</div>
              <div class="result-meta">${esc(meta)}</div>
            </div>
            <button data-action="fetch" data-url="${escAttr(it.url)}">받기</button>
          </div>`;
        })
        .join("");
  }

  results.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;

    if (btn.dataset.action === "clear-results") {
      results.innerHTML = "";
      return;
    }
    btn.disabled = true;
    btn.textContent = "담김";
    try {
      await createJob(btn.dataset.url);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "받기";
      alert(err.message);
    }
  });

  function fmtSize(bytes) {
    if (!bytes) return "";
    return (bytes / 1024 / 1024).toFixed(1) + " MB";
  }

  function titleBlock(j) {
    const title = j.title ?? j.url;
    if (j.id === editingId) {
      //제목은 속성 보간 대신 render() 에서 value 로 대입 — 따옴표 섞인 제목이 onfocus 주입이 되지 않게
      return `<div class="edit-row">
        <input id="edit-input" type="text" aria-label="제목" />
        <button data-action="save" data-id="${j.id}">저장</button>
        <button class="ghost" data-action="cancel">취소</button>
      </div>`;
    }
    //제목 수정 = 파일명 변경이라 완료된 작업에만 노출
    const editBtn =
      j.status === "done" ? `<button class="ghost" data-action="edit" data-id="${j.id}">수정</button>` : "";
    return `<div class="title-row"><div class="job-title">${esc(title)}</div>${editBtn}</div>`;
  }

  function render(jobs) {
    //재렌더로 input 이 교체되기 전에 입력값·커서를 집어둔다
    const prev = document.getElementById("edit-input");
    if (prev) {
      editingTitle = prev.value;
      editingCaret = prev === document.activeElement ? [prev.selectionStart, prev.selectionEnd] : null;
    }

    if (!jobs.length) {
      list.innerHTML = '<p class="empty">링크를 넣으면 여기에 작업이 표시됩니다.</p>';
      return;
    }
    list.innerHTML = jobs
      .map((j) => {
        const showBar = j.status === "downloading" || j.status === "converting";
        return `<div class="job">
          ${titleBlock(j)}
          <div class="job-meta">${LABEL[j.status]}${j.status === "downloading" ? ` · ${j.progress}%` : ""}${j.size ? ` · ${fmtSize(j.size)}` : ""}</div>
          ${showBar ? `<div class="bar"><span style="width:${j.status === "converting" ? 100 : j.progress}%"></span></div>` : ""}
          ${j.error ? `<div class="err">${esc(j.error)}</div>` : ""}
          ${j.status === "done" ? `<div class="saved">저장됨 · ${esc(j.path ?? j.filename ?? "")}</div>` : ""}
        </div>`;
      })
      .join("");

    const input = document.getElementById("edit-input");
    if (input) {
      input.value = editingTitle ?? "";
      if (!prev) {
        //수정행이 막 열린 경우만 전체 선택 — 이미 떠 있던 입력이면 커서만 되살린다(포커스 가로채기 방지)
        input.focus();
        input.select();
      } else if (editingCaret) {
        input.focus();
        input.setSelectionRange(editingCaret[0], editingCaret[1]);
      }
    }
  }

  list.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const { action, id } = btn.dataset;

    if (action === "edit") {
      editingId = id;
      editingTitle = btn.closest(".job").querySelector(".job-title").textContent;
      editingCaret = null;
      refresh();
    } else if (action === "cancel") {
      stopEditing();
      refresh();
    } else if (action === "save") {
      await saveTitle(id, document.getElementById("edit-input").value);
    }
  });

  list.addEventListener("keydown", (e) => {
    if (e.target.id !== "edit-input") return;
    if (e.key === "Enter") {
      e.preventDefault();
      saveTitle(editingId, e.target.value);
    } else if (e.key === "Escape") {
      stopEditing();
      refresh();
    }
  });

  async function saveTitle(id, title) {
    try {
      const res = await fetch(`/api/jobs/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title }),
      });
      if (!res.ok) throw new Error((await res.json()).detail ?? "수정 실패");
      const job = await res.json();
      stopEditing();
      await refresh();
      //같은 이름이 있어 '(2)' 가 붙거나 금지문자가 빠졌으면 모르고 지나가지 않게 알린다
      if (job.title !== title.trim()) alert(`"${job.title}" 로 저장했습니다.`);
    } catch (err) {
      alert(err.message);
    }
  }

  async function refresh() {
    render(await fetch("/api/jobs").then((r) => r.json()));
  }

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  //esc 는 textContent 방식이라 따옴표를 안 바꾼다 — 속성 안에 넣을 값은 반드시 이쪽을 쓴다
  const ATTR_ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  function escAttr(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ATTR_ESCAPES[c]);
  }

  /* 진행 중 작업이 있을 때만 1초 폴링 — 변환은 서버가 들고 있어서 새로고침해도 이어진다 */
  async function tick() {
    let active = false;
    try {
      const jobs = await fetch("/api/jobs").then((r) => r.json());
      render(jobs);
      active = jobs.some((j) => j.status !== "done" && j.status !== "error");
      offline.hidden = true;
    } catch {
      //서버가 죽었다 살아나는 폰 환경 — 실패를 알리기만 하고 폴링은 계속한다
      offline.hidden = false;
    } finally {
      //재예약은 성공·실패와 무관하게 — 한 번 끊기면 새로고침까지 영구 정지한다
      setTimeout(tick, active ? 1000 : 5000);
    }
  }
  tick();

  //PWA 설치(홈화면 추가)용 — localhost 는 보안 출처로 취급돼서 HTTPS 없이도 등록된다
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch((err) => console.warn("sw 등록 실패", err));
  }
</script>
</body>
</html>
